name: Integration (Manual)

# Motivation:
# - Integration tests depend on external Space-Track credentials/service availability.
# - We keep these out of the default push/PR CI path to avoid flaky or blocked merges.
# - Run this workflow manually when credentials are active and you want end-to-end verification.
on:
  # Trigger manually from the Actions UI when Space-Track credentials are available.
  workflow_dispatch:

concurrency:
  # Keep a single manual integration run active at a time for this workflow.
  group: integration-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  integration-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Sync dependencies
        run: |
          uv sync --extra dev

      - name: Run integration tests
        env:
          SPACEUSER: ${{ vars.SPACEUSER }}
          SPACEPSWD: ${{ secrets.SPACEPSWD }}
        run: uv run pytest -m integration
