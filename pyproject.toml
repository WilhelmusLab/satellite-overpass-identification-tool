[project]
name="satellite-overpass-identification-tool"
version = "2024.11.4"
authors = [
    {name="Simon Hatcher"},
    {name="Timothy Divoll", email = "timothy_divoll@brown.edu"},
    {name="John Gerrard Holland", email = "john_holland1@brown.edu"},
    {name="Carlos Paniagua", email = "carlos_paniagua@brown.edu"}
]
requires-python = ">= 3.11"
dependencies = [
  "requests==2.33.1",
  "skyfield==1.54",
  "numpy==2.4.4",
]

[project.optional-dependencies]
dev = ["pytest", "pyfakefs", "ruff>=0.16"]

[project.scripts]
soit="satellite_overpass_identification_tool:main"
satellite-overpass-identification-tool="satellite_overpass_identification_tool:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = ["--doctest-modules"]
markers = [
    "integration: marks tests as integration tests (require network and credentials)",
]

[tool.isort]
profile = "black"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
]
ignore = [
  "E501",
  "F401",
  "F541",
  "B006",
  "B905",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
